<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="monospace" font-size="13"><rect width="1100" height="700" fill="#fff"/>
<text x="550" y="28" text-anchor="middle" font-size="20" font-weight="bold">ThermoX ESP32 wiring (Proteus-style)</text>
<rect x="400" y="60" width="200" height="320" fill="#e6f0ff" stroke="#000" stroke-width="2"/><text x="500.0" y="76" text-anchor="middle" font-weight="bold">ESP32 DevKit</text>
<text x="408" y="114">GPIO32</text>
<line x1="240" y1="110" x2="400" y2="110" stroke="#c0392b" stroke-width="2.5"/><circle cx="240" cy="110" r="3" fill="#c0392b"/><circle cx="400" cy="110" r="3" fill="#c0392b"/><text x="320.0" y="105" text-anchor="middle" fill="#c0392b">BTN1 (to GND)</text>
<text x="408" y="164">GPIO33</text>
<line x1="240" y1="160" x2="400" y2="160" stroke="#c0392b" stroke-width="2.5"/><circle cx="240" cy="160" r="3" fill="#c0392b"/><circle cx="400" cy="160" r="3" fill="#c0392b"/><text x="320.0" y="155" text-anchor="middle" fill="#c0392b">BTN2 (to GND)</text>
<text x="408" y="214">GPIO21 SDA</text>
<line x1="240" y1="210" x2="400" y2="210" stroke="#2980b9" stroke-width="2.5"/><circle cx="240" cy="210" r="3" fill="#2980b9"/><circle cx="400" cy="210" r="3" fill="#2980b9"/><text x="320.0" y="205" text-anchor="middle" fill="#2980b9">SDA</text>
<text x="408" y="264">GPIO22 SCL</text>
<line x1="240" y1="260" x2="400" y2="260" stroke="#2980b9" stroke-width="2.5"/><circle cx="240" cy="260" r="3" fill="#2980b9"/><circle cx="400" cy="260" r="3" fill="#2980b9"/><text x="320.0" y="255" text-anchor="middle" fill="#2980b9">SCL</text>
<text x="408" y="314">GPIO14</text>
<line x1="240" y1="310" x2="400" y2="310" stroke="#27ae60" stroke-width="2.5"/><circle cx="240" cy="310" r="3" fill="#27ae60"/><circle cx="400" cy="310" r="3" fill="#27ae60"/><text x="320.0" y="305" text-anchor="middle" fill="#27ae60">DQ</text>
<text x="592" y="114" text-anchor="end">GPIO27</text>
<line x1="600" y1="110" x2="760" y2="110" stroke="#8e44ad" stroke-width="2.5"/><circle cx="600" cy="110" r="3" fill="#8e44ad"/><circle cx="760" cy="110" r="3" fill="#8e44ad"/><text x="680.0" y="105" text-anchor="middle" fill="#8e44ad">LPWM</text>
<text x="592" y="154" text-anchor="end">GPIO26</text>
<line x1="600" y1="150" x2="760" y2="150" stroke="#8e44ad" stroke-width="2.5"/><circle cx="600" cy="150" r="3" fill="#8e44ad"/><circle cx="760" cy="150" r="3" fill="#8e44ad"/><text x="680.0" y="145" text-anchor="middle" fill="#8e44ad">RPWM</text>
<text x="592" y="194" text-anchor="end">GPIO13</text>
<line x1="600" y1="190" x2="760" y2="190" stroke="#d35400" stroke-width="2.5"/><circle cx="600" cy="190" r="3" fill="#d35400"/><circle cx="760" cy="190" r="3" fill="#d35400"/><text x="680.0" y="185" text-anchor="middle" fill="#d35400">L_EN</text>
<text x="592" y="234" text-anchor="end">GPIO25</text>
<line x1="600" y1="230" x2="760" y2="230" stroke="#d35400" stroke-width="2.5"/><circle cx="600" cy="230" r="3" fill="#d35400"/><circle cx="760" cy="230" r="3" fill="#d35400"/><text x="680.0" y="225" text-anchor="middle" fill="#d35400">R_EN</text>
<text x="592" y="294" text-anchor="end">GPIO23</text>
<line x1="600" y1="290" x2="760" y2="290" stroke="#16a085" stroke-width="2.5"/><circle cx="600" cy="290" r="3" fill="#16a085"/><circle cx="760" cy="290" r="3" fill="#16a085"/><text x="680.0" y="285" text-anchor="middle" fill="#16a085">PWM</text>
<text x="592" y="334" text-anchor="end">GPIO34</text>
<line x1="600" y1="330" x2="760" y2="330" stroke="#16a085" stroke-width="2.5"/><circle cx="600" cy="330" r="3" fill="#16a085"/><circle cx="760" cy="330" r="3" fill="#16a085"/><text x="680.0" y="325" text-anchor="middle" fill="#16a085">TACH/FG</text>
<rect x="80" y="90" width="160" height="40" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="160.0" y="106" text-anchor="middle" font-weight="bold">SW1 Button 1</text>
<rect x="80" y="140" width="160" height="40" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="160.0" y="156" text-anchor="middle" font-weight="bold">SW2 Button 2</text>
<rect x="80" y="190" width="160" height="90" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="160.0" y="206" text-anchor="middle" font-weight="bold">OLED SSD1306 I2C</text>
<rect x="80" y="290" width="160" height="50" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="160.0" y="306" text-anchor="middle" font-weight="bold">DS18B20</text>
<text x="160" y="290" text-anchor="middle" font-size="11" fill="#555">VCC 3V3, GND</text>
<text x="160" y="358" text-anchor="middle" font-size="11" fill="#555">4.7k pull-up DQ to 3V3; VCC 3V3; GND</text>
<rect x="760" y="90" width="200" height="160" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="860.0" y="106" text-anchor="middle" font-weight="bold">BTS7960 driver</text>
<text x="860" y="244" text-anchor="middle" font-size="11" fill="#555">VCC 3V3, GND to ESP32 GND</text>
<rect x="760" y="270" width="200" height="80" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="860.0" y="286" text-anchor="middle" font-weight="bold">SUNON fan (12V)</text>
<text x="860" y="368" text-anchor="middle" font-size="11" fill="#555">FG: 10k pull-up to 3V3 (GPIO34 input-only)</text>
<rect x="760" y="420" width="200" height="50" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="860.0" y="436" text-anchor="middle" font-weight="bold">Peltier / TEC</text>
<rect x="760" y="520" width="200" height="50" fill="#fffbe6" stroke="#000" stroke-width="2"/><text x="860.0" y="536" text-anchor="middle" font-weight="bold">12V battery / supply</text>
<line x1="830" y1="250" x2="830" y2="420" stroke="#e74c3c" stroke-width="3"/><text x="836" y="340" fill="#e74c3c">M+</text>
<line x1="890" y1="250" x2="890" y2="420" stroke="#000" stroke-width="3"/><text x="896" y="400">M-</text>
<line x1="960" y1="545" x2="1010" y2="545" stroke="#e74c3c" stroke-width="3"/><line x1="1010" y1="545" x2="1010" y2="190" stroke="#e74c3c" stroke-width="3"/><line x1="1010" y1="190" x2="960" y2="190" stroke="#e74c3c" stroke-width="3"/><text x="1016" y="370" fill="#e74c3c">B+ / 12V</text>
<text x="400" y="440" font-weight="bold">Notes</text>
<text x="400" y="462" font-size="12">- Common GND for ESP32, BTS7960, fan, sensors, battery.</text>
<text x="400" y="482" font-size="12">- Buttons: INPUT_PULLUP, other side to GND.</text>
<text x="400" y="502" font-size="12">- BTS7960 B+/B- on 12V (not 3V3); M+/M- to Peltier.</text>
<text x="400" y="522" font-size="12">- Never drive LPWM and RPWM together (firmware zeroes the other side).</text>
<text x="400" y="542" font-size="12">- GPIO34 is input-only: needs the external pull-up.</text>
<text x="400" y="562" font-size="12">- GPIO35 battery ADC optional, disabled by default (needs divider).</text>
</svg>